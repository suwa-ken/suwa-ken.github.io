<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="すわ研究所の備品を拾得された方への連絡案内です。">
  <title>すわ研の備品を拾得された方へ</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      color:#172033;
      background:linear-gradient(145deg,#eef5fc,#fff);
      font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif
    }
    header,main,footer{
      width:min(720px,calc(100% - 30px));
      margin:auto
    }
    header{padding:22px 0}
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      color:#172033;
      font-weight:700;
      text-decoration:none
    }
    .mark{
      display:grid;
      place-items:center;
      width:38px;
      height:38px;
      border-radius:10px;
      color:#fff;
      background:#1957a6;
      font-size:21px
    }
    main{padding:30px 0 50px}
    .card{
      padding:clamp(28px,7vw,56px);
      border:1px solid #d8e0eb;
      border-top:8px solid #1957a6;
      border-radius:18px;
      background:#fff;
      box-shadow:0 18px 50px rgba(22,54,92,.12)
    }
    .english{
      margin:0 0 12px;
      color:#1957a6;
      font-size:13px;
      font-weight:800;
      letter-spacing:.14em
    }
    h1{
      margin:0 0 22px;
      font-size:clamp(32px,8vw,52px);
      line-height:1.35
    }
    .lead{
      font-size:clamp(18px,4vw,22px);
      font-weight:700;
      line-height:1.8
    }
    .message{
      color:#5d6677;
      line-height:1.9
    }
    .buttons{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin:30px 0
    }
    .button{
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:54px;
      padding:12px;
      border:1px solid #1957a6;
      border-radius:11px;
      color:#1957a6;
      background:#fff;
      font-weight:700;
      text-decoration:none
    }
    .button.primary{
      color:#fff;
      background:#1957a6
    }
    dl{margin:0;border-top:1px solid #d8e0eb}
    dl div{
      padding:18px 0;
      border-bottom:1px solid #d8e0eb
    }
    dt{
      color:#5d6677;
      font-size:14px;
      font-weight:700
    }
    dd{
      margin:7px 0 0;
      font-size:18px;
      overflow-wrap:anywhere
    }
    dd a{
      color:#1957a6;
      font-weight:700
    }
    .thanks{
      margin:28px 0 0;
      padding:20px;
      border-radius:12px;
      background:#eef5fc;
      line-height:1.8
    }
    .back{
      margin-top:24px;
      text-align:center
    }
    .back a{color:#1957a6}
    footer{
      padding:20px 0 32px;
      color:#697386;
      text-align:center
    }
    @media(max-width:520px){
      .buttons{grid-template-columns:1fr}
      main{padding-top:12px}
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="../">
      <span class="mark">す</span>
      <span>すわ研究所</span>
    </a>
  </header>

  <main>
    <article class="card">
      <p class="english">FOUND ITEM</p>
      <h1>拾ってくださり<br>ありがとうございます</h1>

      <p class="lead">
        この品物は、すわ研究所の備品です。
      </p>

      <p class="message">
        お手数をおかけしますが、下記のいずれかの方法で
        ご連絡をお願いいたします。警察・施設管理者の方も、
        こちらからご連絡いただけます。
      </p>

      <div class="buttons">
        <a class="button primary" href="tel:08057328681">
          電話をかける
        </a>
        <a class="button" href="mailto:aaa@suwaken123.com?subject=すわ研備品の拾得について">
          メールを送る
        </a>
      </div>

      <dl>
        <div>
          <dt>電話</dt>
          <dd><a href="tel:08057328681">080-5732-8681</a></dd>
        </div>
        <div>
          <dt>メール</dt>
          <dd><a href="mailto:aaa@suwaken123.com">aaa@suwaken123.com</a></dd>
        </div>
      </dl>

      <p class="thanks">
        ご親切に保管してくださり、心より御礼申し上げます。
      </p>
    </article>

    <p class="back"><a href="../">すわ研究所トップへ戻る</a></p>
  </main>

  <footer>
    <small>© すわ研究所</small>
  </footer>
</body>
</html>
