<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="すわ研究所の公式サイトです。">
  <title>すわ研究所</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      color:#172033;
      background:linear-gradient(145deg,#f4f8fd,#fff);
      font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif
    }
    header,main,footer{
      width:min(900px,calc(100% - 36px));
      margin:auto
    }
    header{padding:24px 0}
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:700
    }
    .mark{
      display:grid;
      place-items:center;
      width:42px;
      height:42px;
      border-radius:12px;
      color:#fff;
      background:#1957a6;
      font-size:24px
    }
    main{padding:70px 0 50px}
    .english{
      color:#1957a6;
      font-size:13px;
      font-weight:800;
      letter-spacing:.14em
    }
    h1{
      margin:12px 0 22px;
      font-size:clamp(48px,10vw,82px);
      line-height:1.2
    }
    .lead{
      max-width:650px;
      color:#5d6677;
      font-size:clamp(17px,3vw,21px);
      line-height:1.9
    }
    .lost{
      margin-top:90px;
      padding:30px;
      border:1px solid #d8e0eb;
      border-left:7px solid #1957a6;
      border-radius:14px;
      background:#fff;
      box-shadow:0 14px 36px rgba(22,54,92,.08)
    }
    h2{margin:0 0 14px;font-size:clamp(22px,5vw,30px)}
    .lost p{color:#5d6677;line-height:1.8}
    .button{
      display:inline-block;
      margin-top:8px;
      padding:14px 22px;
      border-radius:10px;
      color:#fff;
      background:#1957a6;
      font-weight:700;
      text-decoration:none
    }
    footer{
      padding:32px 0;
      color:#697386;
      text-align:center
    }
    @media(max-width:540px){
      main{padding-top:40px}
      .lost{margin-top:60px;padding:24px 20px}
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="mark">す</span>
      <span>すわ研究所</span>
    </div>
  </header>

  <main>
    <section>
      <p class="english">SUWA ENGINEERING OFFICE</p>
      <h1>すわ研究所</h1>
      <p class="lead">
        給排水設備を中心とした設備設計・申請図面作成を行っています。
      </p>
    </section>

    <section class="lost">
      <h2>すわ研の備品を拾ってくださった方へ</h2>
      <p>
        備品に貼られたQRコードからお越しの場合は、
        下記の紛失物連絡ページをご覧ください。
      </p>
      <a class="button" href="lost/">紛失物連絡ページを開く</a>
    </section>
  </main>

  <footer>
    <small>© すわ研究所</small>
  </footer>
</body>
</html>
